# Dependabot for this repo — two ecosystems:
#
# 1. npm — auto-open a PR when a new zx-kit version is published (the only runtime
#    dependency), plus security fixes for everything else.
# 2. github-actions — stop the workflow's action versions from silently drifting
#    apart across the four repos. Grouped into a single PR so it stays quiet.
#
# ERRATA (2026-08-08). This file used to carry an `allow: [zx-kit]` block with a
# comment claiming security updates reached every dependency "regardless of this
# block". That was WRONG, and it cost three failing Dependabot runs a day:
# `allow` filters SECURITY updates too, so every security job (js-yaml,
# ip-address, postcss, undici) started, found its target excluded by the filter,
# and died with `all_versions_ignored`. The runs looked like they were colliding
# with CI because a push that touches package-lock.json re-evaluates the
# dependency graph and re-fires them — but CI was green the whole time.
#
# `applies-to` cannot split version- and security-update rules at the `updates`
# level (it only exists inside `groups`), so the fix is to drop `allow` entirely
# and use GROUPS to keep the queue quiet instead: routine bumps arrive as one
# batched PR rather than one per package, which is what `allow` was really for.
#
# WHY THIS STILL LOOKS BUSY (2026-08-08). Dropping `allow` uncovered a backlog:
# every dev dependency had been frozen since the filter went in, so the first run
# produced one large batch PR, and the security group produced another as soon as
# it was finally allowed to act. That is a ONE-TIME catch-up, not a new PR per
# merge. What does re-trigger Dependabot is any push that changes
# package-lock.json — it re-evaluates the dependency graph — which is why the PRs
# seem to appear "right after every merge".
#
# Dependabot does NOT touch the changelog or the version number. Those come from
# semantic-release in ci.yml, on any releasable (feat/fix/perf) commit.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    versioning-strategy: increase
    open-pull-requests-limit: 2   # version updates only; security PRs are exempt by design
    groups:
      # zx-kit is the ONLY runtime dependency and the one bump worth reviewing on
      # its own — it ships to players. Kept out of the batch so it never waits
      # behind nine dev-tool bumps.
      zx-kit:
        patterns: ["zx-kit"]
      # Everything else is build/test tooling that never reaches a player, so it
      # arrives as ONE batched PR. Dependabot UPDATES this PR in place on later
      # runs — a daily schedule does not pile up new ones.
      dev-tooling:
        patterns: ["*"]
        exclude-patterns: ["zx-kit"]
      # Security fixes travel in their own PR. NOTE: security updates ignore both
      # `schedule` and `open-pull-requests-limit` — they fire off the alert, not
      # the timer — so this group is what keeps them to a single PR.
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      # Deliberately `chore`, not `fix`: the CI release gate treats a `fix:`
      # subject as releasable, and a dev-only dependency bump should not cut a
      # version of the game by itself.
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
