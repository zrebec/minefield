name: CI & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  release:
    # Only release (and therefore deploy) on releasable commits. chore/docs/ci and
    # dependabot bumps don't cut a version and don't redeploy. Manual override below.
    if: >
      github.event_name == 'push' &&
      (startsWith(github.event.head_commit.message, 'feat') ||
       startsWith(github.event.head_commit.message, 'fix') ||
       startsWith(github.event.head_commit.message, 'perf') ||
       contains(github.event.head_commit.message, 'BREAKING CHANGE'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Release (changelog + tag)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release --no-ci

  build:
    needs: release
    # Build/deploy only when the release job actually ran (releasable commit),
    # or on a manual workflow_dispatch override.
    if: >
      !cancelled() &&
      (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main      # HEAD main-u po semantic-release push (nie triggering commit)
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "untagged")
          VITE_APP_BUILD=$TAG npm run build

      - name: Verify dist/index.html
        run: cat dist/index.html

      - name: Upload artifact
        # v5 (2026-04): Node 24 + current Pages artifact format. The 2024-era v3
        # artifact started being rejected by the Pages backend on 2026-07-03
        # ("Deployment failed, try again later" seconds after creation).
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # v5 (2026-03): Node 24 native (v4 triggered the "forced to run on Node 24"
        # deprecation annotation) and paired with upload-pages-artifact@v5.
        uses: actions/deploy-pages@v5