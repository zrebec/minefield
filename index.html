<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The game is MINEFIELD, and the repo, package and URL all agree. A rename
         to "The Strip" was considered and dropped — see ROADMAP Decisions, 2026-08-16. -->
    <title>MINEFIELD — ZX Spectrum Edition</title>
    <meta
      name="description"
      content="MINEFIELD — an audio-first ZX Spectrum-style game: cross a blind minefield by listening. One daily field for the whole world. Built to be playable blind and deaf."
    />

    <!-- Offline wrap (see docs/offline.md). Every href below is written with
         Vite's base-URL placeholder, substituted at build time, so ONE
         index.html serves both deployments: GitHub Pages (base /minefield/) and
         the itch.io / offline package (base ./). Hard-coding either one breaks
         the other silently. theme-color is the ZX border blue the body
         already paints. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0000FF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Minefield" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        background-color: #0000FF;  /* ZX Spectrum blue border — updated via JS */
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      #game {
        /* Scale to fit viewport, never exceed native 4× size, keep 4:3 ratio */
        width: min(1024px, 100vw, calc(100dvh * 4 / 3));
        height: auto;
        aspect-ratio: 4 / 3;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
        /* Thin white border like a CRT screen */
        outline: 4px solid #CDCDCD;
      }

      /* Screen-reader-only content: visually hidden but still read by assistive
         tech. Never use display:none / visibility:hidden here — those remove the
         nodes from the accessibility tree and silence the live regions. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <canvas
      id="game"
      role="img"
      aria-label="Minefield — a minefield-crossing game rendered on this canvas. Game announcements are read aloud below."
    ></canvas>

    <!-- ARIA live regions (accessibility skeleton, 2026-07-03). The game writes
         here so screen readers speak what the beeper beeps — the v1.0 promise.
         #sr-announcer: urgent, interrupts — mine warnings, explosions, danger.
         #sr-status: polite, queued — score, level, mode, menu state. -->
    <div id="sr-announcer" class="sr-only" role="status" aria-live="assertive" aria-atomic="true"></div>
    <div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>

    <!-- Static hint region — filled with STR_A11Y_LEGEND_HINT ("press H for the
         audio guide") on load and locale change, so a screen reader meets a short
         prompt, not the full guide, every start. H announces the full STR_A11Y_LEGEND.
         NOT a live region: a screen-reader user browses here for the prompt. -->
    <div id="sr-legend" class="sr-only" aria-label="Audio guide"></div>

    <!-- Title-menu mirror — while the title screen is up, main.ts fills this
         (setMenu in a11y.ts) with the menu keys + the high-score table, one
         <p> per line, so a blind player can browse what to press and read the
         scores; cleared on leaving the title so stale menu text can't be found
         mid-run. NOT a live region: the player navigates here, nothing speaks
         on write. -->
    <div id="sr-menu" class="sr-only" aria-label="Menu"></div>

    <noscript>MINEFIELD needs JavaScript to run — it is a browser game rendered on a canvas with Web Audio sound.</noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
