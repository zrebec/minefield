<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MINEFIELD — ZX Spectrum Edition</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        background-color: #0000FF;  /* ZX Spectrum blue border — updated via JS */
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      #game {
        /* Scale to fit viewport, never exceed native 4× size, keep 4:3 ratio */
        width: min(1024px, 100vw, calc(100dvh * 4 / 3));
        height: auto;
        aspect-ratio: 4 / 3;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
        /* Thin white border like a CRT screen */
        outline: 4px solid #CDCDCD;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
